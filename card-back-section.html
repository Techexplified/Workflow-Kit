<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workflow Kit - Card Section</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: transparent;
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      #section-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 10px 14px;
        transition: all 0.2s ease;
      }

      #section-container:hover {
        border-color: #cbd5e1;
        background: #f1f5f9;
      }

      .left-group {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-icon {
        width: 34px;
        height: 34px;
        min-width: 34px;
        background: #f5f3ff;
        color: #7c3aed;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .text-group {
        min-width: 0;
      }

      .section-title {
        font-size: 13.5px;
        font-weight: 700;
        color: #0f172a;
        line-height: 1.25;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .section-badge {
        font-size: 11px;
        font-weight: 600;
        background: #ede9fe;
        color: #7c3aed;
        padding: 1px 7px;
        border-radius: 12px;
      }

      .section-subtitle {
        font-size: 12px;
        color: #64748b;
        line-height: 1.35;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .add-checklist-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background-color: #7c3aed;
        color: #ffffff;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        white-space: nowrap;
        box-shadow: 0 1px 3px rgba(124, 58, 237, 0.25);
      }

      .add-checklist-btn:hover {
        background-color: #6d28d9;
        transform: translateY(-1px);
        box-shadow: 0 3px 8px rgba(124, 58, 237, 0.3);
      }

      .add-checklist-btn:active {
        transform: translateY(0);
      }

      @media (max-width: 420px) {
        .section-subtitle {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="section-container">
      <div class="left-group">
        <div class="brand-icon" id="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21 4.5v12.2a1 1 0 0 1-1.38.93l-5.62-2.34v-8.58l5.62-2.34A1 1 0 0 1 21 4.5zM12 7H4a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h2v4a1 1 0 0 0 1.55.83l3.45-2.3A1 1 0 0 0 12 15.7V7z"/>
          </svg>
        </div>
        <div class="text-group">
          <div class="section-title">
            <span>Workflow Checklists</span>
            <span class="section-badge" id="list-badge" style="display: none;"></span>
          </div>
          <div class="section-subtitle" id="section-subtitle">Add a pre-built checklist template for this stage</div>
        </div>
      </div>
      <button class="add-checklist-btn" id="add-checklist-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Add Checklist</span>
      </button>
    </div>

    <script type="module" src="/src/card-back-section.js"></script>
  </body>
</html>
