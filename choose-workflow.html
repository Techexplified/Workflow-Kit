<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workflow Kit - Choose a workflow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      #container {
        width: 100%;
        max-width: 680px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 16px;
        padding: 28px 32px;
        box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
      }

      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        padding-bottom: 16px;
      }

      .brand-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        background: #f5f3ff;
        color: #7c3aed;
        border-radius: 8px;
      }

      .brand-title {
        font-size: 16px;
        font-weight: 700;
        color: #1e1b4b;
        letter-spacing: -0.01em;
      }

      .main-heading {
        font-size: 22px;
        font-weight: 800;
        color: #0f172a;
        letter-spacing: -0.02em;
        margin-bottom: 6px;
      }

      .subtext {
        font-size: 14px;
        line-height: 1.5;
        color: #64748b;
        margin-bottom: 24px;
      }

      .template-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .template-row {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 20px;
        border-radius: 14px;
        cursor: pointer;
        text-decoration: none;
        user-select: none;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .template-row:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }

      .template-row:active {
        transform: translateY(0);
      }

      .template-icon-box {
        width: 48px;
        height: 48px;
        min-width: 48px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
      }

      .template-info {
        flex: 1;
        min-width: 0;
      }

      .template-title {
        font-size: 15px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 3px;
        line-height: 1.2;
      }

      .template-description {
        font-size: 13px;
        line-height: 1.45;
        color: #475569;
      }

      .template-chevron {
        color: #94a3b8;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-left: 4px;
        transition: transform 0.2s ease, color 0.2s ease;
      }

      .template-row:hover .template-chevron {
        transform: translateX(4px);
        color: #0f172a;
      }

      /* Loading & Error States */
      .state-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 36px 16px;
        min-height: 220px;
      }

      .spinner {
        width: 38px;
        height: 38px;
        border: 3.5px solid #ede9fe;
        border-top-color: #7c3aed;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .state-text {
        font-size: 14px;
        font-weight: 600;
        color: #1e293b;
        margin-top: 16px;
        line-height: 1.4;
      }

      .state-subtext {
        font-size: 13px;
        color: #64748b;
        margin-top: 6px;
      }

      .success-icon-box {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background-color: #dcfce7;
        color: #16a34a;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .error-icon-box {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background-color: #fee2e2;
        color: #dc2626;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }

      .retry-button {
        background-color: #7c3aed;
        color: #ffffff;
        border: none;
        padding: 9px 20px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 16px;
        transition: background-color 0.15s ease, transform 0.1s ease;
      }

      .retry-button:hover {
        background-color: #6d28d9;
      }

      .retry-button:active {
        transform: translateY(1px);
      }

      /* Confirmation State */
      .warning-icon-box {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background-color: #fef3c7;
        color: #d97706;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .confirm-message {
        font-size: 14px;
        line-height: 1.55;
        color: #334155;
        margin-top: 14px;
        max-width: 520px;
      }

      .confirm-actions {
        display: flex;
        gap: 12px;
        margin-top: 22px;
        align-items: center;
        justify-content: center;
      }

      .continue-button {
        background-color: #d97706;
        color: #ffffff;
        border: none;
        padding: 9px 22px;
        border-radius: 8px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.15s ease, transform 0.1s ease;
      }

      .continue-button:hover {
        background-color: #b45309;
      }

      .continue-button:active {
        transform: translateY(1px);
      }

      .secondary-button {
        background-color: #f1f5f9;
        border: none;
        color: #475569;
        padding: 9px 20px;
        border-radius: 8px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .secondary-button:hover {
        background-color: #e2e8f0;
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <!-- Header Row -->
      <div class="header-row">
        <div class="brand-group">
          <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M21 4.5v12.2a1 1 0 0 1-1.38.93l-5.62-2.34v-8.58l5.62-2.34A1 1 0 0 1 21 4.5zM12 7H4a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h2v4a1 1 0 0 0 1.55.83l3.45-2.3A1 1 0 0 0 12 15.7V7z"/>
            </svg>
          </div>
          <span class="brand-title">Workflow Kit</span>
        </div>
      </div>

      <!-- Heading -->
      <h1 class="main-heading">Choose a workflow</h1>
      <p class="subtext">Set up a structured workflow for this card and get a pre-built checklist based on your template.</p>

      <!-- Dynamic Template List -->
      <div id="template-list" class="template-list"></div>
    </div>

    <script type="module" src="/src/choose-workflow.js"></script>
  </body>
</html>
