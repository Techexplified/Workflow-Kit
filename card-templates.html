<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workflow Kit - Add Checklist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        padding: 28px 20px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }

      #container {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 16px;
        padding: 28px 32px;
        box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.03);
      }

      /* Header */
      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }

      .brand-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        background: #f5f3ff;
        color: #7c3aed;
        border-radius: 10px;
      }

      .brand-title {
        font-size: 17px;
        font-weight: 700;
        color: #1e1b4b;
        letter-spacing: -0.01em;
      }

      .close-btn {
        background: transparent;
        border: none;
        color: #64748b;
        cursor: pointer;
        padding: 6px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.15s ease, background-color 0.15s ease;
      }

      .close-btn:hover {
        color: #0f172a;
        background-color: #f1f5f9;
      }

      .header-subtext {
        font-size: 14px;
        line-height: 1.5;
        color: #64748b;
        margin-bottom: 22px;
      }

      .header-subtext strong {
        color: #1e293b;
      }

      /* Section Heading */
      .section-heading {
        font-size: 15px;
        font-weight: 700;
        color: #1e1b4b;
        margin-bottom: 14px;
        letter-spacing: -0.01em;
      }

      /* Template Grid (List View) */
      .template-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        margin-bottom: 24px;
      }

      @media (max-width: 580px) {
        .template-grid {
          grid-template-columns: 1fr;
        }
      }

      .card-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 18px;
        border-radius: 12px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        text-decoration: none;
        user-select: none;
      }

      .card-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      }

      .card-item:active {
        transform: translateY(0);
      }

      .card-icon-box {
        width: 44px;
        height: 44px;
        min-width: 44px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
      }

      .card-info {
        flex: 1;
        min-width: 0;
      }

      .card-title {
        font-size: 14.5px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 4px;
        line-height: 1.25;
      }

      .card-desc {
        font-size: 12.5px;
        line-height: 1.4;
        color: #475569;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .card-chevron {
        color: #94a3b8;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-left: 2px;
        transition: transform 0.15s ease, color 0.15s ease;
      }

      .card-item:hover .card-chevron {
        transform: translateX(4px);
        color: #0f172a;
      }

      /* Preview View */
      .preview-container {
        margin-bottom: 22px;
      }

      .preview-badge-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        padding: 10px 14px;
        border-radius: 10px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
      }

      .preview-badge-icon {
        width: 34px;
        height: 34px;
        min-width: 34px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }

      .preview-badge-text {
        font-size: 14px;
        font-weight: 600;
        color: #1e293b;
      }

      .preview-heading-group {
        margin-bottom: 14px;
      }

      .preview-subtext {
        font-size: 13px;
        color: #64748b;
        margin-top: 2px;
      }

      .checklist-list {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px 14px;
        max-height: min(420px, 50vh);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .checklist-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 12px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        font-size: 13.5px;
        color: #334155;
        font-weight: 500;
        line-height: 1.4;
        user-select: none;
      }

      .checklist-checkbox-mock {
        width: 17px;
        height: 17px;
        min-width: 17px;
        border: 1.8px solid #94a3b8;
        border-radius: 4px;
        background: #ffffff;
      }

      .checklist-item-text {
        flex: 1;
      }

      /* Error Box */
      .inline-error-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background-color: #fef2f2;
        border: 1px solid #fecaca;
        color: #b91c1c;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 13.5px;
        margin-top: 16px;
      }

      .inline-error-content {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .retry-link-btn {
        background: transparent;
        border: none;
        color: #b91c1c;
        font-size: 13px;
        font-weight: 700;
        text-decoration: underline;
        cursor: pointer;
        padding: 0;
      }

      .retry-link-btn:hover {
        color: #991b1b;
      }

      /* Empty State */
      .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: #64748b;
        font-size: 14.5px;
        line-height: 1.5;
        background: #f8fafc;
        border: 1px dashed #cbd5e1;
        border-radius: 12px;
        margin-bottom: 24px;
      }

      /* Footers */
      .footer-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 16px;
        border-top: 1px solid #f1f5f9;
      }

      .footer-info {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        color: #64748b;
      }

      .footer-info strong {
        color: #334155;
      }

      .cancel-button {
        background-color: #f1f5f9;
        border: 1px solid #e2e8f0;
        color: #475569;
        padding: 9px 20px;
        border-radius: 8px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .cancel-button:hover {
        background-color: #e2e8f0;
        color: #0f172a;
      }

      .back-button {
        background-color: #f1f5f9;
        border: 1px solid #e2e8f0;
        color: #475569;
        padding: 9px 20px;
        border-radius: 8px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .back-button:hover {
        background-color: #e2e8f0;
        color: #0f172a;
      }

      .create-card-button {
        background-color: #7c3aed;
        color: #ffffff;
        border: none;
        padding: 9px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: background-color 0.15s ease, transform 0.1s ease;
        box-shadow: 0 1px 3px rgba(124, 58, 237, 0.25);
      }

      .create-card-button:hover:not(:disabled) {
        opacity: 0.92;
      }

      .create-card-button:active:not(:disabled) {
        transform: translateY(1px);
      }

      .create-card-button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .btn-spinner {
        width: 15px;
        height: 15px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="container">
      <!-- Header Row -->
      <div class="header-row">
        <div class="brand-group">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M21 4.5v12.2a1 1 0 0 1-1.38.93l-5.62-2.34v-8.58l5.62-2.34A1 1 0 0 1 21 4.5zM12 7H4a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h2v4a1 1 0 0 0 1.55.83l3.45-2.3A1 1 0 0 0 12 15.7V7z"/>
            </svg>
          </div>
          <span class="brand-title" id="brand-title">Add Checklist</span>
        </div>
        <button id="close-btn" class="close-btn" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Header Subtext -->
      <p id="header-subtext" class="header-subtext">Choose a checklist category to add to this card.</p>

      <!-- View Container -->
      <div id="view-container"></div>
    </div>

    <script type="module" src="/src/card-templates.js"></script>
  </body>
</html>
